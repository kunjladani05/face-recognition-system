<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update User</title>

    <!-- Bootstrap CSS (Version 5.3) for responsive design and styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Static CSS file for custom styles specific to the update page -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/update_user.css' %}">
</head>
<body>

    <!-- Container for the update form -->
    <div class="container mt-5">
        <!-- Title for the page -->
        <h2>Update User</h2>

        <!-- Form for updating the user's details -->
        <form method="POST">
            {% csrf_token %}

            <!-- Username input field -->
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}">
            </div>

            <!-- Email input field -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
            </div>

            <!-- Button group for form submission and navigating back -->
            <div class="button-group">
                <!-- Link to the 'user_details' page (back button) -->
                <a href="{% url 'user_details' %}" class="btn btn-back">Back</a>
                <!-- Submit button to update user -->
                <button type="submit" class="btn btn-primary">Update</button>
            </div>
        </form>
    </div>
</body>
</html>
