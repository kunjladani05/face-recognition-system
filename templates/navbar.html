<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- bootstrap link -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <title>Face Recognition System</title>

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/navbar.css' %}">

</head>

<body>
    <!-- Navigation bar with Bootstrap -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <!-- Container for the navigation bar, ensuring it's responsive -->
        <div class="container-fluid">
            <!-- Brand logo with a link to the home page -->
            <a class="navbar-brand" href="{% url 'home' %}">
                <!-- Logo animation or text for branding -->
                <div class="logo-animation">FR</div>
            </a>

            <!-- Button for the hamburger menu on smaller screens -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <!-- Hamburger icon for mobile view -->
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar items that collapse into a menu on smaller screens -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Home link -->
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
                    </li>
                    <!-- Upload Photo link -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'upload_photo' %}">Upload Photo</a>
                    </li>
                    <!-- Live Recognition link -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'live_recognition' %}">Live Recognition</a>
                    </li>
                </ul>

                <!-- Right-aligned user info and logout button -->
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <!-- User's username display -->
                    <li class="nav-item">
                        <span class="me-3" style="color: black;">Welcome, {{ request.user.username }}</span>
                        <!-- Logout button -->
                        <a class="btn btn-glow" href="{% url 'login' %}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>


</html>
