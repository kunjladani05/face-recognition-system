<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Additional Image</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/profile_images.css' %}">
</head>
<body>
    {% block content %}
    <!-- Main container for the page content -->
    <div class="container">
        <!-- Title of the page, dynamically showing the profile name -->
        <h1>Additional Images for {{ profile.name }}</h1>

        <!-- Check if there are additional images for the profile -->
        {% if additional_images %}
            <!-- Container for displaying images -->
            <div class="image-gallery">
                <!-- Loop through each image in the additional_images list and display it -->
                {% for img in additional_images %}
                    <!-- Image element to display each additional image -->
                    <img src="{{ img.image.url }}" alt="Additional Image">
                {% endfor %}
            </div>
        {% else %}
            <!-- Message to display when no additional images are available -->
            <p>No additional images available.</p>
        {% endif %}

        <!-- Link to go back to the profile list page -->
        <a href="{% url 'profile_list' %}" class="back-button">Back to Profiles</a>
    </div>
    {% endblock %}
</body>

</html>
